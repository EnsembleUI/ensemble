name: Ensemble Test Runner Remote FTL

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'android, ios, or both'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - android
          - ios
      wait_for_completion:
        description: 'Poll FTL until done'
        type: boolean
        default: true
  pull_request:
    paths:
      - 'tools/ensemble_test_runner/**'
      - '.github/workflows/ensemble-test-runner-remote.yml'

# Configure vars via `ensemble_test remote setup` printed CI block (paste into
# GitHub Actions variables). Durable run state lives in GCS
# (ENSEMBLE_TEST_REMOTE_STORE_GCS_BUCKET). GHA artifacts are checkpoints only.

jobs:
  remote-ftl:
    strategy:
      fail-fast: false
      matrix:
        # PRs always run both. workflow_dispatch uses the platform input.
        # (Job-level `if` cannot reference `matrix` — build the matrix here.)
        platform: ${{ github.event_name == 'pull_request' && fromJSON('["android","ios"]') || (inputs.platform == 'android' && fromJSON('["android"]') || (inputs.platform == 'ios' && fromJSON('["ios"]') || fromJSON('["android","ios"]'))) }}
    runs-on: ${{ matrix.platform == 'ios' && 'macos-15' || 'ubuntu-latest' }}
    permissions:
      contents: read
      id-token: write
    env:
      ENSEMBLE_TEST_FTL_PROJECT_ID: ${{ vars.ENSEMBLE_TEST_FTL_PROJECT_ID }}
      ENSEMBLE_TEST_FTL_RESULTS_BUCKET: ${{ secrets.ENSEMBLE_TEST_FTL_RESULTS_BUCKET }}
      ENSEMBLE_TEST_REMOTE_STORE_GCS_BUCKET: ${{ secrets.ENSEMBLE_TEST_REMOTE_STORE_GCS_BUCKET }}
      ENSEMBLE_TEST_REMOTE_STORE_PREFIX: ensemble-test-remote-runs
      REMOTE_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Require remote CI variables
        run: |
          missing=0
          for name in \
            ENSEMBLE_TEST_FTL_PROJECT_ID \
            ENSEMBLE_TEST_FTL_RESULTS_BUCKET \
            ENSEMBLE_TEST_REMOTE_STORE_GCS_BUCKET \
            ENSEMBLE_TEST_GCP_WIF_PROVIDER \
            ENSEMBLE_TEST_GCP_SERVICE_ACCOUNT
          do
            if [ -z "${!name}" ]; then
              echo "Missing required variable: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Run: dart run ensemble_test_runner:ensemble_test remote setup --gcp-project=... --repo=Owner/name"
            echo "Then paste the printed values into GitHub Actions repository variables."
            exit 1
          fi
        env:
          ENSEMBLE_TEST_GCP_WIF_PROVIDER: ${{ secrets.ENSEMBLE_TEST_GCP_WIF_PROVIDER }}
          ENSEMBLE_TEST_GCP_SERVICE_ACCOUNT: ${{ secrets.ENSEMBLE_TEST_GCP_SERVICE_ACCOUNT }}

      - uses: ./.github/actions/setup-flutter

      - name: Disable Swift Package Manager (iOS)
        if: matrix.platform == 'ios'
        run: flutter config --no-enable-swift-package-manager

      # FTL’s newest Xcode is 26.2; host defaults (26.5/27) produce
      # Runner_iphoneos26.5-*.xctestrun and FTL reports 0 XCTest cases.
      # Pin build Xcode to FTL’s current latest; FTL uses that by default.
      - name: Select Xcode 26.2 (iOS)
        if: matrix.platform == 'ios'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      # Xcode 26 Metal.xctoolchain lacks Swift compatibility libs; pin default
      # when a newer toolchain is somehow selected.
      - name: Pin Xcode default toolchain (iOS)
        if: matrix.platform == 'ios'
        run: echo "TOOLCHAINS=com.apple.dt.toolchain.XcodeDefault" >> "$GITHUB_ENV"

      - name: Install Melos
        run: dart pub global activate melos

      # Link workspace packages (local modules/ensemble has resetCachedKey, etc.).
      # Plain `flutter pub get` resolves hosted ensemble from pub.dev and breaks.
      - name: Bootstrap monorepo
        run: melos bootstrap

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.ENSEMBLE_TEST_GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.ENSEMBLE_TEST_GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Unit + contract tests
        if: matrix.platform == 'android'
        working-directory: tools/ensemble_test_runner
        run: flutter test test/remote_execution_test.dart test/remote_setup_test.dart

      - name: Remote suite
        working-directory: tools/ensemble_test_runner/example
        run: |
          dart run ensemble_test_runner:ensemble_test \
            --target=remote \
            --remote-platform=${{ env.REMOTE_PLATFORM }} \
            --app-dir="$PWD"

      - name: Upload remote reports (checkpoint only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ensemble-remote-reports-${{ matrix.platform }}
          path: |
            tools/ensemble_test_runner/example/build/ensemble_test_runner/remote/**
            tools/ensemble_test_runner/example/build/ensemble_test_runner/remote_runs/**
            tools/ensemble_test_runner/example/build/ensemble_test_runner/report/**
          if-no-files-found: ignore
          retention-days: 14
