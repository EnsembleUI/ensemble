name: Create Build Artifacts
on:
  push:

jobs:
  buildStarter:
    name: Build Starter App
    runs-on: ubuntu-latest

    strategy:
      matrix:
        flutter-version: ["3.38.7", "3.47.2"]
        platform: ["web", "android"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ matrix.flutter-version }}

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap Melos
        run: melos bootstrap

      - name: Create temporary keystore for Android signing
        if: matrix.platform == 'android'
        run: |
          cd starter/android
          # Create a temporary keystore for CI builds
          keytool -genkey -v -keystore ci-release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias ci-key \
            -dname "CN=CI Build, OU=CI, O=Ensemble, L=City, S=State, C=US" \
            -storepass ci-password -keypass ci-password
          
          # Create key.properties file with absolute path
          cat > key.properties << EOF
          storePassword=ci-password
          keyPassword=ci-password
          keyAlias=ci-key
          storeFile=$(pwd)/ci-release-key.jks
          EOF
          
          # Verify files were created
          ls -la ci-release-key.jks key.properties

      - name: Build for ${{ matrix.platform }}
        run: |
          cd starter
          case "${{ matrix.platform }}" in
            web)
              flutter build web --release --no-tree-shake-icons
              ;;
            android)
              flutter build apk --release --no-tree-shake-icons
              ;;
          esac

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: starter-build-${{ matrix.platform }}-flutter-${{ matrix.flutter-version }}
          path: |
            starter/build/web/**
            starter/build/app/outputs/flutter-apk/*-release.apk
          retention-days: 7

  # Guards the KPN WebUI build. That project needs the HTML web renderer, which
  # Flutter removed in 3.29, so it is pinned to 3.27.2 and uses only the core
  # `ensemble` package. A full `melos bootstrap` cannot run on 3.27 (auth, chat
  # and ensemble_bluetooth pin collection ^1.19.1 / meta ^1.16.0, unsatisfiable
  # there), so the bootstrap is scoped to the starter and its dependencies.
  buildKpnWebUi:
    name: Build Starter Web (Flutter 3.27.2, core only)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: "3.27.2"

      - name: Assert the starter enables no optional modules
        run: |
          count=$(awk '/^dependencies:/,/^dev_dependencies:/' starter/pubspec.yaml \
                  | grep -cE '^  ensemble[a-z_]*:')
          if [ "$count" -ne 1 ]; then
            echo "::error::This job builds the KPN WebUI configuration, which uses only the core ensemble package. Found $count enabled ensemble* dependencies in starter/pubspec.yaml, expected 1."
            exit 1
          fi

      # Pinned: Flutter 3.27.2 ships Dart 3.6.1, and melos >=6.3.3 requires Dart >=3.8.
      - name: Install Melos
        run: dart pub global activate melos 6.3.2

      - name: Bootstrap the core packages only
        run: melos bootstrap --scope="ensemble_starter" --include-dependencies

      - name: Build web with the HTML renderer
        run: |
          cd starter
          flutter build web --release --web-renderer html --no-tree-shake-icons

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: starter-build-web-flutter-3.27.2-html
          path: starter/build/web/**
          retention-days: 7
