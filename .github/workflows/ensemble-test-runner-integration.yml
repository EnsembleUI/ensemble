name: Ensemble test runner integration modes

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/ensemble_test_runner/**"
      - ".github/workflows/ensemble-test-runner-integration.yml"

jobs:
  android-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          cache: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare example Android application
        working-directory: tools/ensemble_test_runner/example
        run: |
          flutter create --org com.ensembleui --project-name ensemble_test_runner_example --platforms=android .
          flutter pub get
      - name: Run YAML suite on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: >-
            cd tools/ensemble_test_runner/example &&
            dart run ensemble_test_runner:ensemble_test
            --mode=integration
            --device-id=emulator-5554
      - name: Verify Android report artifacts
        working-directory: tools/ensemble_test_runner/example
        run: |
          test -f build/ensemble_test_runner/report/index.html
          test -f build/ensemble_test_runner/report/results.json.gz
          test -d build/ensemble_test_runner/report/screenshots
          test "$(find build/ensemble_test_runner/report/screenshots -type f | wc -l)" -gt 0
      
      - name: Upload Android report artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ensemble_test_runner_example_android_report
          path: tools/ensemble_test_runner/example/build/ensemble_test_runner/report
  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter SDK
        uses: ./.github/actions/setup-flutter
      - name: Disable Flutter SwiftPM integration
        run: flutter config --no-enable-swift-package-manager
      - name: Prepare example iOS application
        working-directory: tools/ensemble_test_runner/example
        run: |
          flutter create --org com.ensembleui --project-name ensemble_test_runner_example --platforms=ios .
          python3 - <<'PY'
          from pathlib import Path
          pod = Path("ios/Podfile")
          pod.write_text(
              pod.read_text().replace(
                  "# platform :ios, '13.0'",
                  "platform :ios, '15.0'",
              )
          )
          pbx = Path("ios/Runner.xcodeproj/project.pbxproj")
          pbx.write_text(
              pbx.read_text().replace(
                  "IPHONEOS_DEPLOYMENT_TARGET = 13.0;",
                  "IPHONEOS_DEPLOYMENT_TARGET = 15.0;",
              )
          )
          plist = Path("ios/Flutter/AppFrameworkInfo.plist")
          if plist.exists():
              plist.write_text(
                  plist.read_text().replace(
                      "<string>13.0</string>",
                      "<string>15.0</string>",
                  )
              )
          PY
          flutter pub get
      - name: Start iOS simulator
        id: simulator
        uses: futureware-tech/simulator-action@v5
        with:
          model: 'iPhone 17'
          os_version: '>= 26.0'
          wait_for_boot: true
          erase_before_boot: true
          boot_timeout_seconds: 360
      - name: Run YAML suite on iOS simulator
        working-directory: tools/ensemble_test_runner/example
        run: >-
          dart run ensemble_test_runner:ensemble_test
          --mode=integration
          --device-id=${{ steps.simulator.outputs.udid }}
      - name: Verify iOS report artifacts
        working-directory: tools/ensemble_test_runner/example
        run: |
          test -f build/ensemble_test_runner/report/index.html
          test -f build/ensemble_test_runner/report/results.json.gz
          test -d build/ensemble_test_runner/report/screenshots
          test "$(find build/ensemble_test_runner/report/screenshots -type f | wc -l)" -gt 0
      - name: Upload iOS report artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ensemble_test_runner_example_ios_report
          path: tools/ensemble_test_runner/example/build/ensemble_test_runner/report