# Automates Releasing a Beta Version on a Feature Branch
#
# Creates a version commit and tag WITHOUT modifying the branch.
# Uses detached HEAD so the branch stays clean - only the tag is pushed.
#
# Flow:
#   1. Checkout branch, detach HEAD
#   2. melos version creates commit + tags on detached HEAD
#   3. Repair and re-tag (.github/scripts/repair_and_retag.sh)
#   4. If publish_to_pubdev, mark the tag with [publish-to-pubdev] so
#      publish-ensemble-pubdev.yml's native tag-push trigger knows to publish
#   5. Push only the ensemble-v<version> tag (branch unchanged)

name: Release Beta Version

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to release from (cannot be main/master)"
        required: true
        type: string
        default: "feature/my-branch"
      version:
        description: "Beta version (must be X.Y.Z-beta.N format)"
        required: true
        type: string
        default: "1.2.47-beta.1"
      publish_to_pubdev:
        description: "Also publish this beta to pub.dev as a prerelease"
        required: false
        type: boolean
        default: false

concurrency:
  group: melos-beta-release-${{ github.repository }}-${{ inputs.branch }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        run: |
          set -euo pipefail

          branch="${{ inputs.branch }}"
          version="${{ inputs.version }}"

          # Block main/master branches
          if [[ "$branch" == "main" || "$branch" == "master" ]]; then
            echo "::error::Cannot release beta to main/master. Use 'Release Ensemble Version' workflow instead."
            exit 1
          fi

          # Validate beta version format
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            echo "::error::Version must be in format X.Y.Z-beta.N (e.g., 1.2.47-beta.1)"
            exit 1
          fi

          echo "Branch: $branch"
          echo "Version: $version"

      - name: Check branch exists
        run: |
          set -euo pipefail

          branch="${{ inputs.branch }}"

          if ! git ls-remote --heads "https://github.com/${{ github.repository }}.git" "$branch" | grep -q "$branch"; then
            echo "::error::Branch '$branch' does not exist on remote."
            exit 1
          fi

          echo "Branch '$branch' exists."

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      # inputs.branch may lack these files or have a stale copy; pull both
      # from wherever this workflow file itself came from (github.sha).
      - name: Use release scripts from this workflow's own ref
        run: |
          git fetch origin ${{ github.sha }} --depth=1
          git checkout ${{ github.sha }} -- .github/scripts .github/workflows/publish-ensemble-pubdev.yml

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.5"
          cache: true

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap
        run: melos bootstrap

      - name: Version packages on detached HEAD
        run: |
          # Detach HEAD so branch ref won't move when melos commits
          # Not strictly necessary since we only push the tag, but keeps intent clear
          git checkout --detach HEAD

          melos version ensemble "${{ inputs.version }}" --yes

      - name: Repair melos dependency-constraint rewrite
        run: .github/scripts/repair_and_retag.sh

      # pub.dev only trusts a publish triggered by a genuine tag push, so the
      # opt-in can't be passed as a workflow input to that workflow -- it has
      # to travel on the tag itself. publish-ensemble-pubdev.yml checks for
      # this marker before publishing a beta.
      - name: Mark tag for pub.dev publishing
        if: inputs.publish_to_pubdev
        run: git tag -f -a "ensemble-v${{ inputs.version }}" -m "[publish-to-pubdev]" HEAD

      - name: Push tag only
        run: |
          # Push only the tag - branch remains unchanged
          # 'tag' keyword ensures we push a tag, not a branch
          git push origin tag ensemble-v${{ inputs.version }}
