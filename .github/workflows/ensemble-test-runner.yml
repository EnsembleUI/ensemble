name: Ensemble Test Runner

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/ensemble_test_runner/**'
      - '.github/workflows/ensemble-test-runner.yml'
      - '.github/actions/setup-flutter/**'
  workflow_dispatch:
    inputs:
      preset:
        description: Benchmark preset
        type: choice
        options: [quick, full]
        default: quick
      service:
        description: Optional comma separated service filter
        type: string
        default: ''
permissions:
  contents: read

jobs:
  ensemble_test_runner:
    name: Analyze, test, and example suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Flutter SDK
        uses: ./.github/actions/setup-flutter

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap
        run: melos bootstrap

      - name: Analyze package
        working-directory: tools/ensemble_test_runner
        run: flutter analyze --no-pub

      - name: Check schema drift
        working-directory: tools/ensemble_test_runner
        run: |
          dart run tool/generate_schema.dart
          git diff --exit-code -- assets/schema/

      - name: Package tests
        working-directory: tools/ensemble_test_runner
        run: flutter test

      - name: Example widget suite
        working-directory: tools/ensemble_test_runner/example
        run: |
          flutter pub get
          dart run ensemble_test_runner:ensemble_test --mode=widget

      - name: Host example widget suite
        working-directory: tools/ensemble_test_runner/example_host
        run: |
          flutter pub get
          dart run ensemble_test_runner:ensemble_test \
            --tests-dir=tests \
            --test-entry=test/application_yaml_tests.dart \
            --mode=widget

  benchmark:
    needs: ensemble_test_runner
    name: Benchmark runner services
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      artifact_url: ${{ steps.archive.outputs.artifact-url }}
    concurrency:
      group: runner-benchmark-history-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter SDK
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: '3.47.2'
      - name: Install Melos
        run: dart pub global activate melos
      - name: Bootstrap
        run: melos bootstrap
      - name: Benchmark runner services (report only)
        working-directory: tools/ensemble_test_runner
        env:
          BENCHMARK_PRESET: ${{ inputs.preset || 'quick' }}
          BENCHMARK_SERVICE: ${{ inputs.service }}
          ENSEMBLE_BENCHMARK_HOST: github-hosted-ubuntu-24.04-x64
          ENSEMBLE_BENCHMARK_OS_VERSION: ubuntu-24.04
        run: dart run tool/benchmark_runner.dart --preset="$BENCHMARK_PRESET" --service="$BENCHMARK_SERVICE"
      - name: Archive run export and dashboard data
        id: archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runner-benchmark-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: tools/ensemble_test_runner/.ensemble_benchmarks/
          include-hidden-files: true
          retention-days: 30

  comment_benchmark_artifact:
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.benchmark.outputs.artifact_url != ''
    needs: benchmark
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Add or update benchmark artifact comment
        uses: actions/github-script@v7
        env:
          ARTIFACT_URL: ${{ needs.benchmark.outputs.artifact_url }}
        with:
          script: |
            const marker = '<!-- runner-benchmark-artifact -->';
            const body = `${marker}\nRunner benchmark report and data (available for 30 days): [download artifact](${process.env.ARTIFACT_URL}). Extract the ZIP and open index.html inside its .ensemble_benchmarks folder.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            const existing = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  deploy_benchmark_pages:
    if: >-
      needs.benchmark.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    needs: benchmark
    name: Deploy benchmark dashboard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Download benchmark dashboard
        uses: actions/download-artifact@v4
        with:
          name: runner-benchmark-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: benchmark-artifact
      - name: Prepare dashboard site
        run: |
          mkdir -p _site
          dashboard="$(find benchmark-artifact -name index.html -print -quit)"
          test -n "$dashboard"
          cp "$dashboard" _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  comment_benchmark_pages:
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.deploy_benchmark_pages.outputs.page_url != ''
    needs: deploy_benchmark_pages
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Add or update deployed dashboard comment
        uses: actions/github-script@v7
        env:
          PAGE_URL: ${{ needs.deploy_benchmark_pages.outputs.page_url }}
        with:
          script: |
            const marker = '<!-- runner-benchmark-pages -->';
            const body = `${marker}\nRunner benchmark dashboard (expires after 30 days without a new benchmark run): [view dashboard](${process.env.PAGE_URL}).`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            const existing = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

            }
