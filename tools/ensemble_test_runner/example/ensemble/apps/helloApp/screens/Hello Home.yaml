View:
  styles:
    useSafeArea: false
  body:
    Column:
      styles:
        padding: ${ device.safeAreaTop + 24 } 16 32 16
        gap: 16
      children:
        - Text:
            testId: greeting_text
            text: Hello from Ensemble
        - TextInput:
            testId: name_input
            label: Name
        - Button:
            testId: navigate_button
            label: Say goodbye
            onTap:
              navigateScreen:
                name: Goodbye
