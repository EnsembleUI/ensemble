# yaml-language-server: $schema=https://cdn.ensembleui.com/schemas/ensemble_test_config_schema.json
mode: integration
# Default stays local. CI / `remote setup` users pass --target=remote.
screenshots:
  enabled: true

performance:
  enabled: false

# FTL catalog (used when --target=remote). Distinct from root devices: viewport matrix.
remote:
  provider: firebaseTestLab
  devices:
    - platform: android
      model: MediumPhone.arm
      version: "36"
      locale: en
      orientation: portrait
    - platform: ios
      model: iphonese3
      version: "26.3"
      locale: en
      orientation: portrait

# Host-local process fixtures are incompatible with remote (FTL). Prefer mocks or
# remote.endpoints with a public HTTPS URL when you need a network stub on device.
