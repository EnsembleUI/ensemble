name: ensemble_test_runner_host_example
description: Flutter host with Ensemble as a child, tested by ensemble_test_runner.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  ensemble:
    hosted: https://pub.dev
    version: ">=1.2.55 <2.0.0"
  ensemble_test_runner:
    path: ..
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

dependency_overrides:
  ensemble:
    path: ../../../modules/ensemble

flutter:
  uses-material-design: true
  assets:
    - ensemble/
    - ensemble/apps/shop/screens/Shop.yaml
    - tests/
