# yaml-language-server: $schema=https://cdn.ensembleui.com/schemas/ensemble_tests_schema.json
id: login_shop_from_card
feature: host-ensemble
tags: [smoke, mixed]
description: Flutter login then open the Ensemble shop from a host Home card
priority: high
steps:
  - expectVisible:
      id: login_screen
  - enterText:
      id: email_field
      value: user@example.com
  - enterText:
      id: password_field
      value: password
  - tap:
      id: login_button
  - waitFor:
      id: host_shell
      timeoutMs: 15000
  - expectVisible:
      id: open_shop_card
  - tap:
      id: open_shop_card
  - waitFor:
      id: shop_route_page
      timeoutMs: 5000
  - waitFor:
      id: shop_title
      timeoutMs: 15000
  - expectVisible:
      id: shop_title
  - expectVisible:
      id: shop_featured_button
  - tap:
      id: shop_featured_button
